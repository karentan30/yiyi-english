<!doctype html><html lang="zh"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>3分钟测出你娃适合的英语教材 + 级别</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
body{background:linear-gradient(160deg,#fff4e0,#ffe0c2);min-height:100vh;color:#3a2318;padding:24px 18px}
.wrap{max-width:520px;margin:0 auto}
.hd{text-align:center;padding:18px 0 24px}
.hd h1{font-size:26px;font-weight:900;line-height:1.4}.hd h1 .y{color:#e8552d}
.hd p{font-size:14px;color:#8a6a55;margin-top:10px}
.q{background:#fff;border-radius:18px;padding:20px;margin-bottom:16px;box-shadow:0 6px 18px rgba(180,120,80,.12)}
.q .t{font-size:17px;font-weight:800;margin-bottom:14px}.q .t b{color:#e8552d}
.opt{display:block;padding:14px 16px;border:2px solid #f0e0d0;border-radius:12px;margin-bottom:10px;font-size:15px;cursor:pointer;transition:.15s}
.opt.sel{border-color:#e8552d;background:#fff2ea;font-weight:700}
.chk{font-size:13px;color:#8a6a55;margin:6px 4px 18px;display:flex;align-items:center;gap:8px}
.btn{width:100%;padding:17px;background:#e8552d;color:#fff;border:none;border-radius:14px;font-size:18px;font-weight:900;cursor:pointer;box-shadow:0 8px 20px rgba(232,85,45,.3)}
.btn:disabled{background:#ccc;box-shadow:none}
#result{display:none;background:#fff;border-radius:18px;padding:26px 22px;text-align:center;box-shadow:0 8px 24px rgba(180,120,80,.16)}
#result h2{font-size:22px;font-weight:900;color:#e8552d;margin-bottom:6px}
#result .lv{font-size:15px;color:#8a6a55;margin-bottom:18px}
#result .rec{background:#fff2ea;border-radius:14px;padding:18px;text-align:left;font-size:15px;line-height:1.7;margin-bottom:20px}
#result .rec b{color:#e8552d}
.road{margin-top:24px;text-align:left}
.road-title{font-size:17px;font-weight:900;color:#3a2318;margin-bottom:16px;text-align:center}
.road-tier{background:linear-gradient(135deg,#fff7f2,#ffe8d8);border:2px solid #f5c9a8;border-radius:16px;padding:18px;margin-bottom:16px}
.road-tier-hd{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.road-tier-icon{font-size:24px}
.road-tier-label{font-size:15px;font-weight:900;color:#e8552d}
.timeline{position:relative;padding-left:20px}
.timeline::before{content:'';position:absolute;left:7px;top:4px;bottom:4px;width:2px;background:linear-gradient(to bottom,#e8552d,#f5c9a8)}
.tl-step{position:relative;margin-bottom:14px}
.tl-dot{position:absolute;left:-20px;top:3px;width:14px;height:14px;border-radius:50%;background:#e8552d;border:2px solid #fff;box-shadow:0 0 0 2px #e8552d}
.tl-phase{font-size:12px;font-weight:800;color:#e8552d;text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px}
.tl-actions{font-size:13px;color:#5a3410;line-height:1.6}
.tl-actions .tag{display:inline-block;background:#fff2ea;border:1px solid #f5c9a8;border-radius:6px;padding:1px 7px;font-size:12px;margin:2px 2px 0 0;color:#c04020}
.road-cta{display:block;width:100%;padding:16px;background:linear-gradient(135deg,#e8552d,#c04020);color:#fff;border:none;border-radius:14px;font-size:16px;font-weight:900;cursor:pointer;text-align:center;text-decoration:none;box-shadow:0 6px 18px rgba(232,85,45,.35);margin-top:10px}
.road-note{font-size:13px;color:#8a6a55;font-style:italic;margin-top:10px;padding:10px 14px;background:#fff8f5;border-radius:10px;border-left:3px solid #e8552d}
.foot{font-size:12px;color:#b09a8a;text-align:center;margin-top:22px;line-height:1.6}
</style></head>
<body><div class="wrap">
<div class="hd"><h1>3分钟测出你娃<br>适合的英语教材 · <span class="y">什么级别</span></h1>
<p>别再盲目囤教材 · 答完自动推荐</p></div>

<form id="quiz">
<div class="q"><div class="t">1️⃣ 娃现在<b>几岁 / 什么阶段</b>？</div>
<div class="opts" data-k="age">
<label class="opt" data-v="1">3-5岁 · 启蒙期</label>
<label class="opt" data-v="2">6-8岁 · 小学低年级</label>
<label class="opt" data-v="3">9-12岁 · 小学高年级</label>
<label class="opt" data-v="4">12岁以上 · 初高中</label></div></div>

<div class="q"><div class="t">2️⃣ 自然拼读 / 认读能力？</div>
<div class="opts" data-k="phonics">
<label class="opt" data-v="1">还不会拼读</label>
<label class="opt" data-v="2">学过一点，部分能拼</label>
<label class="opt" data-v="3">见词基本能读</label></div></div>

<div class="q"><div class="t">3️⃣ 目前能读多长的英文？</div>
<div class="opts" data-k="read">
<label class="opt" data-v="1">单词 / 图片认读</label>
<label class="opt" data-v="2">简单短句</label>
<label class="opt" data-v="3">短段落 / 简单绘本</label>
<label class="opt" data-v="4">章节书 / 长文章</label></div></div>

<div class="q"><div class="t">4️⃣ 主要目标？</div>
<div class="opts" data-k="goal">
<label class="opt" data-v="cn">校内提升 / 应用</label>
<label class="opt" data-v="intl">国际路线 / 留学</label>
<label class="opt" data-v="exam">考级(KET/PET/雅思)</label></div></div>

<div class="q"><div class="t">5️⃣ 每月英语学习<b>预算</b>大概是？</div>
<div class="opts" data-k="budget">
<label class="opt" data-v="free">暂时不打算花钱</label>
<label class="opt" data-v="low">500元以内</label>
<label class="opt" data-v="mid">500 - 2000元</label>
<label class="opt" data-v="high">2000元以上</label></div></div>

<div class="chk"><input type="checkbox" id="agree"> 我是监护人，同意用于测评分析（不收集敏感信息）</div>
<button class="btn" type="submit" id="sub" disabled>看我娃的结果 →</button>
</form>

<div id="result">
<h2 id="rTitle"></h2><div class="lv" id="rLevel"></div>
<div class="rec" id="rRec"></div>
<div class="road" id="rRoad"></div>
<div style="font-size:16px;font-weight:800;color:#5a3410;margin-bottom:10px">想要完整报告 + 对应书单 + 学习建议？</div>
<div style="font-size:14px;color:#8a6a55;margin-bottom:10px">留个联系方式，老师1对1发你（免费）：</div>
<input id="contact" placeholder="微信号 / 手机号" style="width:100%;padding:14px 16px;border:2px solid #f0e0d0;border-radius:12px;font-size:16px;margin-bottom:12px">
<button class="btn" id="getReport">领取我娃的完整报告 →</button>
<div id="thanks" style="display:none;font-size:15px;color:#2a8a5a;font-weight:700;margin-top:14px">✅ 收到啦！老师会尽快把报告发给你～</div>
<div style="font-size:13px;color:#b09a8a;margin-top:16px">不方便留？也可回小红书评论区打【测评】进群领 🌸</div>
</div>
<div class="foot">※ 本测评为学习规划参考建议，非成绩承诺。<br>结果仅供家长选材参考。</div>
</div>

<script>
const ans={};
document.querySelectorAll('.opts').forEach(g=>{
  g.querySelectorAll('.opt').forEach(o=>o.onclick=()=>{
    g.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));
    o.classList.add('sel');ans[g.dataset.k]=o.dataset.v;check();
  });
});
document.getElementById('agree').onchange=check;
function check(){
  const ok=ans.age&&ans.phonics&&ans.read&&ans.goal&&ans.budget&&document.getElementById('agree').checked;
  document.getElementById('sub').disabled=!ok;
}
document.getElementById('quiz').onsubmit=e=>{
  e.preventDefault();
  const r=+ans.read, p=+ans.phonics;
  let title,level,rec;
  if(r<=1||p<=1){title='启蒙磨耳朵阶段';level='建议先打语感 + 自然拼读';
    rec='<b>推荐：</b>儿歌+动画磨耳朵 → 自然拼读入门（26字母+字母组合）。<br><b>教材方向：</b>Show and Tell / 拼读入门，先别上分级阅读。<br><b>先补：</b>"敢开口"——每天说，别只输入。';}
  else if(r==2){title='初级分级阅读阶段';level='对应 RAZ aa-C / 牛津树 1-3阶';
    rec='<b>推荐：</b>RAZ 低级别 或 牛津树，从短句到短段落。<br><b>教材方向：</b>Reach Higher 1A起。<br><b>配外教：</b>用课本练"课文对话"，练开口。';}
  else if(r==3){title='中级阅读阶段';level='对应 RAZ D-J / 牛津树 4-6阶';
    rec='<b>推荐：</b>分级阅读+精读，Reach Higher 中段。<br>'+(ans.goal=='intl'?'<b>国际路线：</b>可加原版 Reading Explorer / 学术词。':'<b>校内：</b>课本+外教补口语，冲 KET。')+'<br><b>重点：</b>从"读懂"到"读快"+ 开口表达。';}
  else{title='高阶 / 学术阅读阶段';level='对应 RAZ K+ / 章节书';
    rec='<b>推荐：</b>'+(ans.goal=='exam'||ans.goal=='intl'?'Unlock / Reading Explorer，对标 PET/FCE/雅思。':'原版精读+写作 Great Writing。')+'<br><b>重点：</b>学术阅读+写作+演讲表达，真外教实战。';}
  document.getElementById('quiz').style.display='none';
  document.getElementById('rTitle').textContent='📊 你娃处于：'+title;
  document.getElementById('rLevel').textContent=level;
  document.getElementById('rRec').innerHTML=rec;
  document.getElementById('rRoad').innerHTML=buildRoad(r,p,ans.goal,ans.budget);
  document.getElementById('result').style.display='block';
  window.scrollTo(0,0);
};
function buildRoad(r,p,goal,budget){
  const isHigh=(budget==='high');
  const isMid=(budget==='mid');
  const isFree=(budget==='free'||budget==='low');

  // Determine stage label
  let stage,stageLong;
  if(r<=1||p<=1){stage='启蒙';stageLong='自然拼读 / 磨耳朵';}
  else if(r==2){stage='初级';stageLong='分级阅读入门';}
  else if(r==3){stage='中级';stageLong='阅读流畅 + 口语输出';}
  else{stage='高阶';stageLong='学术阅读 / 备考';}

  // Per-budget roadmap steps
  let tierIcon,tierLabel,tierColor,steps,note,ctaHtml='';

  if(isFree){
    tierIcon='🌱';tierLabel='免费资源路线';
    steps=[
      {phase:'第1个月',actions:[
        stage==='启蒙'?'<span class="tag">磨耳朵</span> Super Simple Songs / Cocomelon 每天20分钟':'<span class="tag">词汇</span> 墨墨背单词（免费版）每天15词',
        stage==='启蒙'?'<span class="tag">拼读</span> B站搜「自然拼读零基础」（推荐：朵拉老师频道）':'<span class="tag">语法</span> 《新概念英语》第一册，B站配套讲解'
      ]},
      {phase:'第2-3个月',actions:[
        '<span class="tag">阅读</span> RAZ-Kids 免费额度（每月5-8本），图书馆借牛津树分级读物',
        stage==='高阶'?'<span class="tag">听力</span> VOA Learning English / TED-Ed（YouTube免费）':'<span class="tag">听力</span> 按段位选动画：'+(r<=1?'Peppa Pig':r==2?'Wild Kratts':'Crash Course Kids')+''
      ]},
      {phase:'3个月后',actions:[
        '<span class="tag">评估</span> 用RAZ级别测孩子真实阅读层，再规划下阶段',
        goal==='intl'?'<span class="tag">目标</span> 免费备考：British Council Kids 网站官方样题':'<span class="tag">巩固</span> 每天坚持「听+读+说」三件事，进步超过纯刷课'
      ]}
    ];
    note='先用这套免费方案扎实练3个月，打好基础再上课效果翻倍。很多孩子在免费阶段就能上升2个级别！';
  } else if(isMid){
    tierIcon='📚';tierLabel='中教网课路线';
    steps=[
      {phase:'第1个月',actions:[
        '<span class="tag">系统学</span> 选一套中教网课（VIPKID/学而思/新东方在线），每周2次语法+阅读',
        '<span class="tag">配套练</span> 《新概念英语》或 Reach Higher 课本同步跟读'
      ]},
      {phase:'第2-3个月',actions:[
        '<span class="tag">分级阅读</span> RAZ正式版（约¥300/年），每天一本',
        stage==='高阶'?'<span class="tag">备考</span> KET/PET 历年真题卷，老师批改作文':'<span class="tag">口语</span> 中教课堂对话练习 + 跟读APP（流利说）',
        goal==='intl'||goal==='exam'?'<span class="tag">词汇</span> 牛津树套装（¥300-500）系统读':'<span class="tag">书单</span> 图书馆借原版绘本，配网课精讲'
      ]},
      {phase:'3个月后',actions:[
        '<span class="tag">测评</span> 让老师做阶段测评，判断是否需要换级别课程',
        '<span class="tag">规划</span> 有中教陪学进步更稳——适合需要提升考试成绩的孩子'
      ]}
    ];
    note='有中教系统陪学，进步比纯自学快2倍。每周2次课 + 每天自练30分钟，3个月可上升1-2个级别。';
  } else {
    tierIcon='🚀';tierLabel='外教1v1 · 快速突破路线';
    steps=[
      {phase:'第1个月',actions:[
        '<span class="tag">定级</span> 欧美外教1v1 Level Test，按CEFR精准定级',
        '<span class="tag">口语</span> 每周2-3次外教课，全英沉浸，快速激活开口'
      ]},
      {phase:'第2-3个月',actions:[
        '<span class="tag">阅读</span> 配套结构化课程（Reading Explorer / Unlock），外教逐篇精讲',
        goal==='exam'||goal==='intl'?'<span class="tag">备考</span> KET/PET/托福少儿系统备考，外教批改写作':'<span class="tag">表达</span> 演讲/辩论/项目式英语，真实场景练习',
        '<span class="tag">词汇</span> Academic Word List，老师出针对性练习'
      ]},
      {phase:'3个月后',actions:[
        '<span class="tag">评估</span> CEFR级别测试，国际认证留档',
        goal==='intl'?'<span class="tag">目标</span> 对标国际学校面试 / 留学语言要求，专项冲刺':'<span class="tag">进阶</span> 保持每周2次外教，同步推进考级备考'
      ]}
    ];
    note='外教1v1是突破口语的最快方式，适合目标国际学校/留学的孩子。';
    ctaHtml='<a class="road-cta" href="#getReport" onclick="document.getElementById(\'contact\').scrollIntoView({behavior:\'smooth\'});return false;">立即预约 YiYi 外教免费试课 →</a>';
  }

  const stepsHtml=steps.map(s=>`
    <div class="tl-step">
      <div class="tl-dot"></div>
      <div class="tl-phase">${s.phase}</div>
      <div class="tl-actions">${s.actions.map(a=>`• ${a}`).join('<br>')}</div>
    </div>`).join('');

  return `
  <div class="road-title">📍 你娃的专属学习路线图<br><small style="font-size:13px;font-weight:500;color:#8a6a55">当前阶段：${stageLong}</small></div>
  <div class="road-tier">
    <div class="road-tier-hd">
      <span class="road-tier-icon">${tierIcon}</span>
      <span class="road-tier-label">${tierLabel}</span>
    </div>
    <div class="timeline">${stepsHtml}</div>
    <div class="road-note">${note}</div>
    ${ctaHtml}
  </div>`;
}

document.getElementById('getReport').onclick=()=>{
  const c=document.getElementById('contact').value.trim();
  if(!c){document.getElementById('contact').focus();return;}
  fetch('https://backend-fabulousslim.vercel.app/api/lead',{
    method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({contact:c,source:'yiyi-测评',answers:ans})
  }).catch(()=>{});
  document.getElementById('getReport').style.display='none';
  document.getElementById('contact').style.display='none';
  document.getElementById('thanks').style.display='block';
};
</script></body></html>
