<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--ink:#0a0a0a;--accent:#002FA7;--grey:#737373;--line:#d4d4d2}
html,body{width:1080px;height:1440px}
body{background:#fafaf8;font-family:"Helvetica Neue","PingFang SC","Noto Sans SC",sans-serif;color:var(--ink);padding:80px 76px;display:flex;flex-direction:column}
.top{display:flex;justify-content:space-between;align-items:center;font-family:"SF Mono",monospace;font-size:26px;letter-spacing:2px;color:var(--grey)}
.tag{background:var(--accent);color:#fff;padding:8px 20px;border-radius:6px;font-weight:600;letter-spacing:1px}
.rule{height:3px;background:var(--ink);margin:28px 0 0}
.kicker{font-family:"SF Mono",monospace;font-size:30px;color:var(--accent);letter-spacing:2px;margin-top:54px;font-weight:600}
h1{font-size:118px;font-weight:300;line-height:1.05;letter-spacing:-2px;margin-top:12px}
h1 b{font-weight:700}
.sub{font-size:38px;color:var(--grey);margin-top:24px;line-height:1.5;font-weight:300}
.eng{margin-top:56px;border-left:8px solid var(--accent);padding-left:34px}
.eng .big{font-family:"Helvetica Neue",sans-serif;font-size:96px;font-weight:800;line-height:1.1;letter-spacing:-1px}
.eng .row{font-size:52px;font-weight:600;margin-top:14px}
.eng .row span{color:var(--accent)}
.steps{margin-top:auto;display:flex;flex-direction:column;gap:22px}
.step{display:flex;align-items:baseline;gap:22px;font-size:40px;font-weight:400}
.step .n{font-family:"Helvetica Neue";font-size:44px;font-weight:800;color:var(--accent);min-width:52px}
.step b{font-weight:700}
.foot{margin-top:40px;background:var(--accent);color:#fff;font-size:36px;font-weight:600;padding:22px 30px;border-radius:14px;text-align:center;letter-spacing:1px}
</style></head><body>
<div class="top"><span class="tag">YiYi英语</span><span>PHONICS · 01</span></div>
<div class="rule"></div>
<div class="kicker">听说好 · 读写差怎么破</div>
<h1>会说，<b>却不会写</b></h1>
<div class="sub">不是娃懒——是他一直"靠耳朵"学，眼睛没给字定过型。</div>
<div class="eng">
  <div class="big">Phonics</div>
  <div class="row">cat = <span>c-a-t</span> &nbsp;·&nbsp; sh → <span>one sound</span></div>
</div>
<div class="steps">
  <div class="step"><span class="n">01</span><div>自然拼读：把<b>字母和音对上号</b>，cat拆成 c-a-t 三个音拼起来</div></div>
  <div class="step"><span class="n">02</span><div><b>指读</b>：边听边用手指着单词读，让词在眼睛里"定型"</div></div>
  <div class="step"><span class="n">03</span><div>边读边<b>试着拼写</b>，听到、看到、写出，三条腿才稳</div></div>
</div>
<div class="foot">评论区扣【方法】· 领自然拼读 42 音表</div>
</body></html>
